<title>CFA ESG 考点总结 P300</title>
<style>
:root{
  --page:#f5f8fc;
  --paper:#ffffff;
  --ink:#182435;
  --muted:#58677a;
  --soft:#edf5ff;
  --line:#d7e1ea;
  --line-strong:#a9bfd4;
  --blue:#0f6cbd;
  --blue-soft:#ebf3fc;
  --red:#c81e1e;
  --red-soft:#fff0f0;
  --green:#0f6cbd;
  --green-soft:#ebf3fc;
  --amber:#b45309;
  --amber-soft:#fff4df;
  --shadow:0 18px 48px rgba(25,35,53,.08);
  --font:"Aptos","Segoe UI","Microsoft YaHei",sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);line-height:1.68}
button,input{font:inherit}
a{color:inherit}
.shell{max-width:1320px;margin:0 auto;padding:22px 18px 70px}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;margin-bottom:14px}
.brand{display:flex;gap:14px;align-items:flex-start}
.brand-mark{width:48px;height:48px;display:grid;place-items:center;background:#102033;color:#fff;border-radius:8px;font-weight:800;letter-spacing:.04em}
h1{margin:0;font-size:30px;line-height:1.18;font-weight:750;letter-spacing:0;text-wrap:balance}
.lead{margin:7px 0 0;color:var(--muted);font-size:15px}
.mini-metrics{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.metric{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;min-width:82px}
.metric strong{display:block;font-size:18px;line-height:1.1}
.metric span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.toolbar{position:sticky;top:0;z-index:10;background:color-mix(in oklch,var(--page) 88%,transparent);backdrop-filter:blur(16px);padding:10px 0 12px;border-bottom:1px solid color-mix(in oklch,var(--line) 70%,transparent)}
.tools{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:10px;align-items:center}
.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:10px 13px;color:var(--ink)}
.search:focus{outline:2px solid color-mix(in oklch,var(--blue) 35%,transparent);border-color:var(--blue)}
.quick{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toggle{min-height:44px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink)}
.toggle.active{background:#102033;color:#fff;border-color:#102033}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.rail{position:sticky;top:84px;max-height:calc(100vh - 104px);overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:10px}
.rail-title{margin:4px 6px 8px;color:var(--muted);font-size:12px;font-weight:750;letter-spacing:.08em}
.toc{display:grid;gap:3px}
.toc a{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;text-decoration:none;border-radius:6px;padding:8px 7px;color:var(--muted)}
.toc a:hover{background:var(--blue-soft);color:#0b4f8a}
.toc-no{font-family:var(--mono);font-size:12px;color:var(--blue);font-weight:800}
.toc-title{font-size:13px;line-height:1.35}
.cards{display:grid;gap:18px}
.study-card{background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);scroll-margin-top:96px;overflow:hidden}
.study-head{display:grid;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;min-height:26px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;color:var(--muted);background:#fff}
.chip.no{background:#102033;color:#fff;border-color:#102033;font-family:var(--mono)}
.chip.red{background:var(--red-soft);border-color:#ffc9c9;color:var(--red)}
.chip.green{background:var(--green-soft);border-color:#b4d6fa;color:var(--green)}
.study-card h2{margin:0;font-size:22px;line-height:1.3;font-weight:760;letter-spacing:0;text-wrap:balance}
.study-body{padding:0 20px 20px}
.section{display:grid;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0}
.section-title{margin:0;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.focus-tags{display:flex;gap:7px;flex-wrap:wrap}
.focus-tag{display:inline-flex;align-items:center;min-height:28px;border:1px solid #ffc9c9;background:var(--red-soft);color:#991b1b;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:750}
.principle{margin:0;font-size:16px;color:#182435}
.equation{display:grid;gap:7px;border-top:2px solid #0f6cbd;border-bottom:1px solid var(--line);padding:12px 0}
.equation code{font-family:var(--font);font-size:16px;font-weight:760;color:#102033;background:transparent;white-space:normal}
.pairs{display:grid;gap:10px}
.pair{display:grid;grid-template-columns:1fr;gap:5px;align-items:start;padding:11px 0;border-bottom:1px dashed var(--line)}
.pair:last-child{border-bottom:0}
.en{margin:0;color:#102033;font-size:15px;line-height:1.55}
.zh{margin:0;color:#58677a;font-size:15px;line-height:1.72}
.en::before,.zh::before{display:inline-block;margin-right:8px;font-family:var(--mono);font-size:11px;font-weight:800;color:var(--muted)}
.en::before{content:"英"}
.zh::before{content:"中"}
.memory{margin:0;padding-left:20px;color:#2f3a47}
.memory li{margin:4px 0}
.figure{margin:0;padding:0;border-top:1px solid var(--line)}
.figure img{display:block;width:100%;height:auto;border:1px solid var(--line);background:#fff;border-radius:6px}
.figcaption{margin-top:8px;color:var(--muted);font-size:13px}
.empty{border:1px dashed var(--line-strong);border-radius:8px;background:var(--paper);padding:28px;text-align:center;color:var(--muted);font-weight:700}
mark{background:#d9ecff;color:#0b4f8a;padding:0 2px;border-radius:2px}
.source-red{color:var(--red);font-weight:800}
@media(max-width:920px){
  .shell{padding:16px 12px 60px}
  .top{grid-template-columns:1fr}
  .mini-metrics{justify-content:flex-start}
  .toolbar{position:static}
  .tools{grid-template-columns:1fr}
  .quick{justify-content:flex-start}
  .layout{grid-template-columns:1fr}
  .rail{position:static;max-height:270px}
  .pair{grid-template-columns:1fr;gap:4px}
  .study-head,.study-body{padding-left:14px;padding-right:14px}
}

.ipad-serif{
  --page:#f5f8fc;
  --paper:#ffffff;
  --ink:#182435;
  --muted:#58677a;
  --line:#d7e1ea;
  --line-strong:#a9bfd4;
  --blue:#0b4f8a;
  --blue-soft:#ebf3fc;
  --red:#b42318;
  --red-soft:#fff3ef;
  --shadow:0 14px 42px rgba(15,42,80,.08);
  --serif-cn:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Noto Serif SC",serif;
}
.ipad-serif body{background:var(--page)}
.ipad-serif .brand-mark{background:#0b4f8a}
.ipad-serif .lead{font-size:16px}
.ipad-serif .study-card{box-shadow:var(--shadow)}
.ipad-serif .principle,
.ipad-serif .zh,
.ipad-serif .memory{
  font-family:var(--serif-cn);
  font-size:17px;
  line-height:1.92;
  letter-spacing:.01em;
}
.ipad-serif .en{
  font-size:16px;
  line-height:1.66;
}
.ipad-serif .equation code{
  font-size:17px;
  line-height:1.72;
}
.ipad-serif .section-title{
  letter-spacing:.06em;
}
@media(min-width:760px) and (max-width:1180px){
  .ipad-serif .shell{max-width:1040px;padding:24px 22px 80px}
  .ipad-serif .layout{grid-template-columns:220px minmax(0,1fr);gap:16px}
  .ipad-serif .study-head{padding:20px 22px 16px}
  .ipad-serif .study-body{padding:0 22px 24px}
  .ipad-serif .pair{padding:13px 0}
}
</style>

istItem":true},{"page":11,"text":"3) Reduced externalities（减少外部性）","segments":[{"text":"3) ","red":false},{"text":"Reduced externalities","red":false},{"text":"（减少外部性）","red":false}],"red":false,"redText":"","listItem":true},{"page":11,"text":"4) Improved adaptability to sustainability megatrends（增强对可持续发展大趋势的适应性）","segments":[{"text":"4) ","red":false},{"text":"Improved adaptability to sustainability megatrends","red":false},{"text":"（增强对可持续发展大趋势的适应","red":false},{"text":"性）","red":false}],"red":false,"redText":"","listItem":true}],"redSource":["Financial materiality"],"images":[],"redPhrases":["Financial materiality"],"redReasons":["定义核心"],"redCount":1},{"id":13,"chapter":1,"chapterTitle":"Introduction to ESG Investing","title":"外部性","summaryPage":5,"pdfPageStart":11,"subtitle":"","lines":[{"page":11,"text":"The term externalities refers to situations where the production or consumption of goods and services creates costs or benefits for others that are not reflected in the prices charged for them. In other words, externalities affect people not directly involved in the transactions. Externalities can be either negative or positive.","segments":[{"text":"The","red":false},{"text":" ","red":false},{"text":"term","red":false},{"text":" ","red":false},{"text":"externalities","red":false},{"text":" ","red":false},{"text":"refers","red":false},{"text":" ","red":false},{"text":"to","red":false},{"text":" ","red":false},{"text":"situations","red":false},{"text":" ","red":true},{"text":"where","red":true},{"text":" ","red":true},{"text":"the","red":true},{"text":" ","red":true},{"text":"production","red":true},{"text":" ","red":true},{"text":"or","red":true},{"text":" ","red":true},{"text":"consumption","red":true},{"text":" ","red":true},{"text":"of","red":true},{"text":" ","red":false},{"text":"goods and services creates costs or benefits for others that are not reflected in the","red":true},{"text":" ","red":true},{"text":"prices","red":true},{"text":" ","red":false},{" Text":""},{"page":12,"text":"Negative Externality","segments":[{"text":"Negative Externality","red":false}],"red":false,"redText":""},{"page":null,"text":"反之，如果邻居在阳台养鸽子，鸽毛和粪便飘落至你家阳台，甚至产生异味。你需要花费额外时间打扫卫生，甚至可能因异味影响生活质量。邻居养鸽的收益（个人爱好）归自己，但你承担的清洁成本和健康风险未通过市场机制让邻居补偿，属于邻居行为带来的额外社会成本。","segments":[{"text":"反之，如果邻居在阳台养鸽子，鸽毛和粪便飘落至你家阳台，甚至产生异味。你需要花费额外时间打扫卫生，甚至可能因异味影响生活质量。邻居养鸽的收益（个人爱好）归自己，但你承担的清洁成本和健康风险未通过市场机制让邻居补偿，属于邻居行为带来的额外社会成本。","red":false}],"red":false,"redText":""}],"redSource":["where the production or consumption of","goods and services creates costs or benefits for others that are not reflected in the prices","charged for them","Externalities"],"images":[{"src":"key_points_assets/kp013_externalities.png","pdfPage":11,"caption":"外部性的定义、负外部性与内部化处理图"}],"redPhrases":["where the production or consumption of","goods and services creates costs or benefits for others that are not reflected in the prices","charged for them","Externalities"],"redReasons":["关键词","定义核心"],"redCount":4},{"id":14,"chapter":2,"chapterTitle":"The ESG Market","title":"PRI 原则的背景","summaryPage":7,"pdfPageStart":13,"subtitle":"PRI","lines":[{"page":13,"text":"“Who Cares Wins” and the Freshfields Report formed the backbone for the launch of the Principles for Responsible Investment（PRI）in 2006.","segments":[{"text":"“","red":false},{"text":"Who Cares Wins","red":true},{"text":"” and the","red":false},{"text":" Freshfields Report","red":true},{"text":" formed the backbone","red":false},{"text":" ","red":false},{"text":"for the launch of","red":false},{"text":" ","red":false},{"text":"the Principles for Responsible Investment","red":false},{"text":"（","red":false},{"text":"PRI","red":false},{"text":"）","red":false},{"text":"in 2006.","red":false}],"red":true,"redText":"Who Cares Wins Freshfields Report"},{"page":13,"text":"（“Who Cares Wins”）报告和Freshfields","segments":[{"text":"（“","red":false},{"text":"Who Cares Wins","red":false},{"text":"”）报告和","red":false},{"text":"Freshfields","red":true}],"red":true,"red ions that correspond to the long-term vision of a low-carbon and climate resilient future（符合低碳和气候适应型未来长期愿景的项目和解决方案）","red":false},{"text":" ","red":false},{"text":"举例：新建一座光伏电站","red":false},{"text":"说明：该项目直接使用可再生能源，符合零碳未来长期愿景，能持续为低碳社会供电。","red":false}],"red":false,"redText":"","listItem":true},{"page":null,"text":"2) Medium green: projects and solutions that represent significant steps towards the long-term vision but are not quite there yet（代表实现长期愿景的重要步骤，但尚未完全实现的项目和解决方案） 举例：新建天然气联合循环发电厂替代燃煤电厂说明：虽然比煤炭减排 50%，但仍是化石能源，属于过渡阶段的重要改进，尚未达到零排放目标。","segments":[{"text":"2) Medium green: projects and solutions that represent significant steps towards the long-term vision but are not quite there yet（代表实现长期愿景的重要步骤，但尚未完全实现的项目和解决方案）","red":false},{"text":" ","red":false},{"text":"举例：新建天然气联合循环发电厂替代燃煤电厂","red":false},{"text":"说明：虽然比煤炭减排 50%，但仍是化石能源，属于过渡阶段的重要改进，尚未达到零排放目标。","red":false}],"red":false,"redText":"","listItem":true},{"page":null,"text":"3) Light green: transition activities that do not lock in emissions. These projects reduce emissions or have other environmental benefits in the near term rather than representing low carbon and climate resilient long-term solutions（不锁定排放的过渡活动。这些项目在短期内减少排放或具有其他环境效益，而不是代表低碳和气候适应性的长期解决方案） 举例：工厂用天然气锅炉替换燃煤锅炉说明：短期内减少污染和碳排放，但属于临时性改进措施，未来仍需升级为电驱动等更清洁方案。","segments":[{"text":"3) Light green: transition activities that do not lock in emissions. These projects reduce emissions or have other environmental benefits in the near term rather than representing low carbon and climate resilient long-term solutions（不锁定排放的过渡活动。这些项目在短期内减少排放或具有其他环境效益，而不是代表低碳和气候适应性的长期解决方案）","red":false},{"text":" ","red":false},{"text":"举例：工厂用天然气锅炉替换燃煤锅炉","red":false},{"text":"说明：短期内减少污染和碳排放，但属于临时性改进措施，未来仍需升级为电驱动等更清洁方案。","red":false}],"red":false,"redText":"","listItem":true},{"page":null,"text":"4) Yellow: projects and solutions that do not explicitly contribute to the transition to a low carbon and climate resilient future. This category also includes activities with too little information to assess（对向低碳和气候适应型未来过渡没有明确贡献的项目和解决方案。这一类还包括信息太少而无法评估的活动） 举例：新建普通公路（未配置充电桩/绿化带） 说明：缺乏明确的低碳设计，且未提供全生命周期排放数据，无法评估其对气候适应的贡献。","segments":[{"text":"4) Yellow: projects and solutions that do not explicitly contribute to the transition to a low carbon and climate resilient future. This category also includes activities with too little information to assess（对向低碳和气候适应型未来过渡没有明确贡献的项目和解决方案。这一类还包括信息太少而无法评估的活动）","red":false},{"text":" ","red":false},{"text":"举例：新建普通公路（未配置充电桩/绿化带）","red":false},{"text":" ","red":false},{"text":"说明：缺乏明确的低碳设计，且未提供全生命周期排放数据，无法评估其对气候适应的贡献。","red":false}],"red":false,"redText":"","listItem":true},{"page":null,"text":"5) Red: projects and solutions that have no role to play in a low-carbon and climate resilient future. These are the heaviest emitting assets, with the most potential for lock in of emissions and highest risk of stranded assets（在低碳和气候适应型未来中没有作用的项目和解决方案。这些是排放最重的资产，最有可能锁定排放，搁浅资产的风险最高） 举例：新建亚临界燃煤电厂说明：采用低效高排放技术，运营周期将锁定 40 年高碳排放，未来极可能因碳税政策成为搁浅资产。","segments":[{"text":"5) Red: projects and solutions that have no role to play in a low-carbon and climate resilient future. These are the heaviest emitting assets, with the most potential for lock in of emissions and highest risk of stranded assets（在低碳和气候适应型未来中没有作用的项目和解决方案。这些是排放最重的资产，最有可能锁定排放，搁浅资产的风险最高）","red":false},{"text":" ","red":false},{"text":"举例：新建亚临界燃煤电厂","red":false},{"text":"说明：采用低效高排放技术，运营周期将锁定 40 年高碳排放，未来极可能因碳税政策成为搁浅资产。","red":false}],"red":false,"redText":"","listItem":true}],"redSource":["Dark green","Medium green","Light green","Yellow","Red:"],"images":[],"redPhrases":["Dark green","Medium green","Light green","Yellow","Red:"],"redReasons":["关键词"],"redCount":5},{"id":29,"chapter":3,"chapterTitle":"Environmental Factors","title":"欧盟可持续金融信息披露条例（EU SFDR）","summaryPage":14,"pdfPageStart":20,"subtitle":"","lines":[{"page":null,"text":"EU SFDR","segments":[{"text":"EU SFDR","red":false}],"red":false,"redText":"","listItem":false},{"page":null,"text":"In 2021, the European Union’s Sustainable Finance Disclosure Regulation（SFDR）came into force. The SFDR is designed to support institutional asset owners and retail clients to compare, select, and monitor the sustainability characteristics of investment funds by standardizing sustainability disclosures.","segments":[{"text":"In 2021, the European Union’s Sustainable Finance Disclosure Regulation（SFDR）came into force. The SFDR is designed to support institutional asset owners and retail clients to compare, select, and monitor the sustainability characteristics of investment funds by standardizing sustainability disclosures.","red":false}],"red":false,"redText":"","listItem":false},{"page":null,"text":"2021 年，欧盟《可持续金融信息披露条例》（Sustainable Finance Disclosure Regulation，SFDR）正式生效。该条例旨在通过标准化可持续信息披露，帮助机构资产所有者和零售客户比较、选择和监控投资基金的可持续特征。","segments":[{"text":"2021 年，欧盟《可持续金融信息披露条例》（Sustainable Finance Disclosure Regulation，SFDR）正式生效。该条例旨在通过标准化可持续信息披露，帮助机构资产所有者和零售客户比较、选择和监控投资基金的可持续特征。","red":false}],"red":false,"redText":"","listItem":false},{"page":null,"text":"内容一：","segments":[{"text":"内容一：","red":false}],"red":false,"redText":"","listItem":false},{"page":null,"text":"1) Article 6 products（which are not promoted as incorporating any ESG factors or objectives）（不关心 not promote） 第 6 条产品（Article 6 products）：未宣传纳入任何 ESG 因素或目标的产品","segments":[{"text":"1) Article 6 products（which are not promoted as incorporating any ESG factors or objectives）（不关心 not promote）","red":false},{"text":" ","red":false},{"text":"第 6 条产品（Article 6 products）：未宣传纳入任何 ESG 因素或目标的产品","red":false}],"red":false,"redText":"","listItem":true},{"page":null,"text":"2) Article 8 products（products claimed to promote environmental and social characteristics）（有特征 claim to promote） 第 8 条产品（Article 8 products）：声称具有环境和社会特征的产品","segments":[{"text":"2) Article 8 products（products claimed to promote environmental and social characteristics）（有特征 claim to promote）","red":false},{"text":" ","red":false},{"text":"第 8 条产品（Article 8 products）：声称具有环境和社会特征的产品","red":false}],"red":false,"redText":"","listItem":true},{"page":null,"text":"3) Article 9 products（products that have sustainable investment as an objective）（有目标 objective） 第 9 条产品（Article 9 products）：以可持续投资为目标的产品内容二：","segments":[{"text":"3) Article 9 products（products that have sustainable investment as an objective）（有目标 objective）","red":false},{"text":" ","red":false},{"text":"第 9 条产品（Article 9 products）：以可持续投资为目标的产品","red":false},{"text":"内容二：","red":false}],"red":false,"redText":"","listItem":true},{"page":null,"text":"避免漂绿（green washing），提高以下方面的透明度（provide more transparency around）","segments":[{"text":"避免漂绿（green washing），提高以下方面的透明度（provide more transparency around）","red":false}],"red":false,"redText":"","listItem":false},{"page":null,"text":"1) How the impacts of sustainability risks on their financial products are being systematically assessed（可持续风险对其金融产品的影响如何被系统评估）","segments":[{"text":"1) How the impacts of sustainability risks on their financial products are being systematically assessed（可持续风险对其金融产品的影响如何被系统评估）","red":false}],"red":false,"redText":"","listItem":true},{"page":null,"text":"2) How asset managers consider — and seek to address — the potentially negative implications of investment activities on sustainability factors（基金经理如何考虑并试图解决投资活动对可持续因素可能产生的负面影响）","segments":[{"text":"2) How asset managers consider — and seek to address — the potentially negative implications of investment activities on sustainability factors（基金经理如何考虑并试图解决投资活动对可持续因素可能产生的负面影响）","red":false}],"red":false,"redText":"","listItem":true},{"page":null,"text":"3) Products labeled with an explicit ESG focus（具有明确 ESG 关注点的产品） 2023.1.1 以后，强制披露可持续相关信息，自愿披露 ESG 信息。EU SFDR 统计范围 1~3 的碳排放（scope 1, 2, 3 的 carbon emission）","segments":[{"text":"3) Products labeled with an explicit ESG focus（具有明确 ESG 关注点的产品）","red":false},{"text":" ","red":false},{"text":"2023.1.1 以后，强制披露可持续相关信息，自愿披露 ESG 信息。EU SFDR 统计范围 1~3 的碳排放（scope 1, 2, 3 的 carbon emission）","red":false}],"red":false,"redText":"","list d","red":false},{"text":" ","red":false},{"text":"2050,","red":false},{"text":" ","red":false},{"text":"and","red":false},{"text":" ","red":false},{"text":"continued","red":false},{"text":" ","red":false},{"text":"net","red":false},{"text":" ","red":false},{"text":"negative","red":false},{"text":" ","red":false},{"text":"emissions until beyond 2100, coupled with deep reductions in emissions of other GHGs, such","red":false},{"text":" ","red":false},{"text":"as methane.","red":false}],"red":true,"redText":"The Race to Net Zero"},{"page":21,"text":"净零竞赛（The Race to Net Zero）：联合国政府间气候变化专门委员会（IPCC）发现，要使全球平均气温上升幅度控制在工业化前水平以上1.5°C（2.7°F）的概率达到三分之二（2/3），需实现以下目标：","segments":[{"text":"净零竞赛（","red":false},{"text":"The Race to Net Zero","red":false},{"text":"）：联合国政府间气候变化专门委员会（","red":false},{"text":"IPCC","red":false},{"text":"）发","red":false},{"text":"现，要使全球平均气温上升幅度控制在工业化前水平以上","red":false},{"text":"1.5°C","red":false},{"text":"（","red":false},{"text":"2.7°F","red":false},{"text":"）的概率达到三","red":false},{"text":"分之二（","red":false},{"text":"2/3","red":false},{"text":"），需实现以下目标：","red":false}],"red":false,"redText":""},{"page":21,"text":"到2030 年，排放量较2005 年水平减少45%","segments":[{"text":"到","red":false},{"text":"2030","red":false},{"text":" ","red":false},{"text":"年，排放量较","red":false},{"text":"2005","red":false},{"text":" ","red":false},{"text":"年水平减少","red":false},{"text":"45%","red":false}],"red":false,"redText":"","listItem":true},{"page":21,"text":"到2050 年左右实现二氧化碳净零排放","segments":[{"text":"到","red":false},{"text":"2050","red":false},{"text":" ","red":false},{"text":"年左右实现二氧化碳净零排放","red":false}],"red":false,"redText":"","listItem":true},{"page":21,"text":"2100 年后继续保持净负排放同时大幅减少甲烷等其他温室气体（GHGs）的排放。","segments":[{"text":"2100","red":false},{"text":" ","red":false},{"text":"年后继续保持净负排放","red":false},{"text":"同时大幅减少甲烷等其他温室气体（","red":false},{"text":"GHGs","red":false},{"text":"）的排放。","red":false}],"red":false,"redText":"","listItem":true}],"redSource":["The Race to Net Zero"],"images":[ <script id="notes" type="application/json">{"1":{"point":"先把联合国理解成四条线：企业行为、金融机构、投资者、气候治理。","equation":"UN 重要倡议 == 企业规范 UNGC + 金融框架 UNEP FI + 投资原则 UN PRI + 气候框架 UNFCCC","pairs":[["Key initiatives proposed by United Nations","联合国提出的重要倡议。"],["United Nations Global Compact (UNGC)","联合国全球契约组织，主要面向企业行为和十项原则。"],["United Nations Environment Programme Finance Initiative (UNEP FI)","联合国环境署金融倡议，主要面向金融机构。"],["United Nations Principles for Responsible Investment (UN PRI)","联合国责任投资原则，主要面向投资者。"],["United Nations Framework Convention on Climate Change (UNFCCC)","联合国气候变化框架公约，主要面向全球气候治理。"]],"memory":["看到 UN，不要散记名称，先问它约束谁。","企业、金融机构、投资者、气候治理，四类对象就能带出四个缩写。"]},"2":{"point":"UNEP FI 的框架按金融行业角色拆：投资、保险、银行。","equation":"UNEP FI 框架 == PRI(投资) + PSI(保险) + PRB(银行)","pairs":[["The Principles for Responsible Investment (PRI)","责任投资原则，2006 年由 UNEP FI 与 UNGC 共同设立。"],["The Principles for Sustainable Insurance (PSI)","可持续保险原则，2012 年由 UNEP FI 设立。"],["The Principles for Responsible Banking (PRB)","责任银行原则，截至 2021 年 4 月已有超过 220 家银行签署。"]],"memory":["PRI 记投资者，PSI 记保险，PRB 记银行。","这题不要按年份背，先按行业角色背，年份只是定位。"]},"3":{"point":"UNGC 十项原则来自四个领域，四个领域又对应四份基础文件。","equation":"UNGC 十项原则 == 人权 + 劳工 + 环境 + 反腐败","pairs":[["Human rights","人权。"],["Labor","劳工。"],["Environment","环境。"],["Anti-corruption","反腐败。"],["Universal Declaration of Human Rights","《世界人权宣言》。"],["ILO Declaration on Fundamental Principles and Rights at Work","《国际劳工组织关于工作中的基本原则和权利宣言》。"],["Rio Declaration on Environment and Development","《里约环境与发展宣言》。"],["United Nations Convention Against Corruption","《联合国反腐败公约》。"]],"memory":["四个领域就是 H-L-E-A。","先背领域，再把四份文件分别挂到领域下面。"]},"4":{"point":"这不是普通原则清单，而是工商企业与人权的 PRR 框架。","equation":"Business and Human Rights == Protect + Respect + Remedy","pairs":[["UN Guiding Principles on Business and Human Rights","联合国工商企业与人权指导原则。"],["Protect","保护，通常指国家保护人权的责任。"],["Respect","尊重，通常指企业尊重人权的责任。"],["Remedy","补救，指受影响主体应有救济渠道。"],["PRR framework","PRR 框架，就是 Protect、Respect、Remedy 三个词的首字母。"]],"memory":["PRR 按责任链记：国家先保护，企业要尊重，出问题要补救。"]},"5":{"point":"PRI 六原则是一条投资管理链：投前纳入、持有期参与、向外披露、向行业推广、共同协作、最后报告。","equation":"PRI 六原则 == 纳入分析 + 主动所有权 + 要求披露 + 推广原则 + 协作执行 + 报告进展","pairs":[["We will incorporate ESG issues into investment analysis and decision-making processes.","我们会把 ESG 问题纳入投资分析和决策流程。"],["We will be active owners and incorporate ESG issues into our ownership policies and practices.","我们会成为积极所有者，并把 ESG 问题纳入所有权政策和实践。"],["We will seek appropriate disclosure on ESG issues by the entities in which we invest.","我们会要求被投资实体适当披露 ESG 问题。"],["We will promote acceptance and implementation of the principles within the investment industry.","我们会推动投资行业接受并执行这些原则。"],["We will work together to enhance our effectiveness in implementing the principles.","我们会通过合作提高执行原则的效果。"],["We will each report on our activities and progress towards implementing the principles.","我们会分别报告执行原则的活动和进展。"]],"memory":["顺序按投资流程走：纳入、参与、披露、推广、协作、报告。","红字都是动词，考试常考“哪一步在做什么”。"]},"6":{"point":"加入 PRI 的最低要求，本质是证明你不是只签名，而是真的有人、有资产、有问责。","equation":"PRI 最低要求 == 覆盖资产 + 有人负责 + 高层问责","pairs":[["Cover more than 50% of assets under management (AUM).","管理资产规模覆盖超过 50%。"],["Internal or external staff responsibility.","有内部或外部人员负责。"],["Senior-level commitment and accountability mechanisms.","有高层承诺和问责机制。"]],"memory":["50% 是范围，staff 是执行人，senior accountability 是责任闭环。"]},"7":{"point":"PRI 筛选实施六步骤可以用 IPIARM 记，但不能只背字母，要记它是一条实施流程。","equation":"IPIARM == Identify + Publicize + Introduce + Adapt + Review + Monitoring","pairs":[["Identify clients priorities","确定客户优先级。"],["Publicize clear screening criteria","公开清晰的筛选标准。"],["Introduce oversight","引入监督。"],["Adapt investment process","调整投资流程。"],["Review portfolio implications","回顾组合影响。"],["Monitoring, reporting and audit","监控、报告和审计。"]],"memory":["先知道客户要什么，再公开标准。","然后加监督、改流程、看组合影响，最后持续监控和审计。"]},"8":{"point":"双重重要性不是两个概念硬拼，而是方向相反的两条影响路径。","equation":"Double materiality == 气候/ESG 影响公司 + 公司影响气候/ESG","pairs":[["Financial materiality","财务重要性，外部 ESG 因素对公司价值、风险和收益的影响。"],["Environmental and social materiality","环境与社会重要性，公司对外部环境和社会的影响。"],["Climate-related impacts on the company","气候相关因素对公司的影响。"],["Impacts of a company on the climate or any other ESG factor","公司对气候或其他 ESG 因素的影响。"]],"memory":["箭头很重要：外部到公司是财务重要性，公司到外部是环境社会重要性。"]},"9":{"point":"TBL 把绩效从单一利润扩展到社会、环境、经济三条底线。","equation":"Triple Bottom Line == Social + Environmental + Economic","pairs":[["Triple bottom line (TBL)","三重底线。"],["Social","社会维度。"],["Environmental","环境维度。"],["Economic","经济维度。"],["Accounting tool to manage trade-offs","用于管理不同目标之间权衡的会计工具。"]],"memory":["TBL 不是只谈环保，它是三条底线一起看。"]},"10":{"point":"Three P 是 TBL 的更口语化表达，把三条底线换成三个 P。","equation":"Three P’s == People + Planet + Profit","pairs":[["People","人，对应社会维度。"],["Planet","地球，对应环境和生物圈维度。"],["Profit","利润，对应经济和财务维度。"],["The TBL accounting theory evolves into a broader accounting framework focusing on Three P’s.","TBL 会计理论进一步发展为以 Three P 为核心的更广泛会计框架。"]],"memory":["People 记社会，Planet 记环境，Profit 记经济。"]},"11":{"point":"UNFCCC 的考试点集中在两个 COP：京都和巴黎。","equation":"UNFCCC 关键会议 == COP3 Kyoto Protocol + COP21 Paris Agreement","pairs":[["United Nations Framework Convention on Climate Change (UNFCCC)","联合国气候变化框架公约。"],["Conference of the Parties (COP)","缔约方大会。"],["COP3 meeting in Kyoto in 1997 created the Kyoto Protocol.","1997 年京都 COP3 形成《京都议定书》。"],["Kyoto Protocol commits industrialized countries to limit and reduce GHG emissions.","《京都议定书》要求工业化国家限制和减少温室气体排放。"],["COP21 meeting in Paris in 2015 led to the Paris Agreement.","2015 年巴黎 COP21 达成《巴黎协定》。"],["Keep global temperature rise well below 2°C above pre-industrial levels.","将本世纪全球升温控制在工业化前水平以上 2 摄氏度以内。"]],"memory":["京都记工业化国家减排，巴黎记全球共同控温。"]},"12":{"point":"财务重要性要落到“为什么能降风险或提收益”。","equation":"Financial materiality == 降成本提效率 + 少罚款 + 少外部性 + 顺应可持续趋势","pairs":[["Financial materiality","财务重要性。"],["Reduced cost and increased efficiency","降低成本并提高效率。"],["Reduced risk of fines","减少罚款风险。"],["Reduced externalities","减少外部性。"],["Improved adaptability to sustainability megatrends","增强对可持续发展大趋势的适应性。"]],"memory":["先问财务后果：成本、罚款、外部性、长期趋势。"]},"13":{"point":"外部性的核心不是“好事或坏事”，而是交易价格没有反映对第三方的影响。","equation":"Externalities == 第三方成本/收益 + 未进入交易价格","pairs":[["Externalities","外部性。"],["Production or consumption creates costs or benefits for others.","生产或消费给他人带来成本或收益。"],["Costs or benefits are not reflected in the prices charged.","这些成本或收益没有反映在交易价格中。"],["People not directly involved in the transactions are affected.","未直接参与交易的人受到影响。"],["Positive externality","正外部性，第三方获得未付费的收益。"],["Negative externality","负外部性，第三方承担未补偿的成本。"]],"memory":["抓两个词：第三方、价格未反映。只要有这两个，就是外部性。"]},"14":{"point":"PRI 的推出不是凭空来的，前面有两个基础文件。","equation":"PRI 背景 == Who Cares Wins + Freshfields Report","pairs":[["Who Cares Wins","“谁在乎，谁赢”报告。"],["Freshfields Report","Freshfields 报告。"],["They formed the backbone for the launch of PRI in 2006.","二者构成 2006 年 PRI 推出的主要基础。"]],"memory":["看到 PRI 背景题，先想两个文件：Who Cares Wins 和 Freshfields。"]},"15":{"point":"ERISA 下 ESG 的态度随政府变化，核心是“能不能在退休金投资中考虑非财务因素”。","equation":"ERISA ESG 立场 == 克林顿放开 + 小布什收紧 + 奥巴马放开 + 特朗普收紧 + 拜登放开","pairs":[["Employee Retirement Income Security Act (ERISA)","美国《雇员退休收入保障法》。"],["Clinton Interpretive Bulletin 1994-1 established economically targeted investments (ETIs).","克林顿时期 IB 1994-1 确立经济目标投资 ETIs。"],["ETIs seek financial returns while producing societal benefits.","ETIs 在获取财务回报的同时产生社会收益。"],["Commensurate with","相当于，强调社会收益不能牺牲应有财务回报。"],["IB 2008-01 under George W. Bush treated non-economic factors as rare.","小布什时期 IB 2008-01 认为非经济因素应很少考虑。"],["IB 2015-01 under Obama expanded the use of ESG investing principles.","奥巴马时期 IB 2015-01 扩大 ESG 投资原则的使用。"],["Final rule 85 FR 72846 under Trump focused on non-financial objectives.","特朗普时期最终规则 85 FR 72846 对非财务目标持限制态度。"],["Biden administration allowed ESG criteria and proxy voting in private sector retirement plans.","拜登时期允许私营退休计划考虑 ESG 标准和代理投票。"]],"memory":["按总统时间线记态度摆动：放、收、放、收、放。"]}}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const NOTES = JSON.parse(document.getElementById('notes').textContent);
let filter = 'all';
let query = '';

const metricsEl = document.getElementById('metrics');
const cardsEl = document.getElementById('cards');
const tocEl = document.getElementById('toc');
const searchEl = document.getElementById('search');
const showAll = document.getElementById('showAll');
const showRed = document.getElementById('showRed');
const showImage = document.getElementById('showImage');

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function escapeRegExp(value){
  return value.replace(/[.*+?^$(){}|[\]\\]/g, '\\$&');
}

function hasChinese(value){
  return /[\u3400-\u9fff]/.test(value || '');
}

function hasEnglish(value){
  return /[A-Za-z]/.test(value || '');
}

function extractEnglish(value){
  const text = String(value || '');
  const matches = text.match(/[A-Za-z][A-Za-z0-9’'.,:/&%°() -]{3,}/g) || [];
  return matches.map(part => part.trim()).filter(part => part.length >= 4).slice(0, 3).join('；');
}

function autoPairs(item){
  const lines = (item.lines || []).map(line => String(line.text || '').trim()).filter(Boolean);
  const pairs = [];
  for (let index = 0; index < lines.length; index += 1) {
    const line = lines[index];
    const next = lines[index + 1] || '';
    if (hasEnglish(line) && !hasChinese(line)) {
      if (hasChinese(next)) {
        pairs.push([line, next]);
        index += 1;
      } else {
        pairs.push([line, '中文理解：这一句是原文英文，先按红字锚点回到本考点标题理解。']);
      }
      continue;
    }
    if (hasEnglish(line) && hasChinese(line)) {
      const english = extractEnglish(line);
      pairs.push([english || item.title, line]);
      continue;
    }
    pairs.push(['', line]);
  }
  if (!pairs.length) {
    pairs.push([item.title, '本考点在原提取文本中正文较少，建议结合 PDF 对应页和知识图复核。']);
  }
  return pairs.slice(0, 90);
}

function autoNote(item){
  const anchors = (item.redPhrases || []).filter(Boolean);
  const shortAnchors = anchors.slice(0, 6);
  const equationRight = shortAnchors.length ? shortAnchors.join(' + ') : '定义 + 分类 + 适用场景';
  return {
    point: '先抓住“' + item.title + '”：红字是考试锚点，正文按英文原文和中文理解对应阅读。',
    equation: item.title + ' == ' + equationRight,
    pairs: autoPairs(item),
    memory: shortAnchors.length
      ? ['先记红字：' + shortAnchors.slice(0, 4).join('、') + '。', '再回到正文，看这些词分别对应定义、步骤、分类或例外。']
      : ['先看标题确定题目，再用正文补足定义、分类和例外。']
  };
}

function getNote(item){
  return NOTES[item.id] || autoNote(item);
}

function highlight(value){
  const safe = escapeHtml(value);
  const terms = query.trim().split(/\s+/).filter(Boolean).slice(0, 6).map(escapeRegExp);
  if (!terms.length) return safe;
  return safe.replace(new RegExp('(' + terms.join('|') + ')', 'gi'), '<mark>$1</mark>');
}

function textForSearch(item){
  const note = NOTES[item.id] || {};
  return [
    item.id,
    item.title,
    item.chapterTitle,
    ...(item.redPhrases || []),
    note.point,
    note.equation,
    ...(note.pairs || []).flat(),
    ...(note.memory || []),
    ...(item.images || []).map(img => img.caption),
  ].join(' ').toLowerCase();
}

function filteredItems(){
  const q = query.trim().toLowerCase();
  return DATA.items.filter(item => {
    if (filter === 'red' && !item.redCount) return false;
    if (filter === 'image' && !(item.images && item.images.length)) return false;
    if (!q) return true;
    const haystack = textForSearch(item);
    return q.split(/\s+/).every(term => haystack.includes(term));
  });
}

function renderMetrics(items){
  metricsEl.innerHTML = [
    [DATA.modeLabel || '样板', DATA.sampleItems],
    ['红字', items.filter(item => item.redCount).length],
    ['知识图', items.filter(item => item.images && item.images.length).length],
    ['全文考点', DATA.totalItems],
  ].map(([label, value]) => '<div class="metric"><strong>' + value + '</strong><span>' + label + '</span></div>').join('');
}

function renderToc(items){
  tocEl.innerHTML = items.map(item =>
    '<a href="#item-' + item.id + '">' +
      '<span class="toc-no">' + String(item.id).padStart(2, '0') + '</span>' +
      '<span class="toc-title">' + highlight(item.title) + '</span>' +
    '</a>'
  ).join('') || '<div class="empty">没有匹配的考点</div>';
}

function renderFocus(item){
  if (!item.redPhrases || !item.redPhrases.length) return '';
  return '<section class="section">' +
    '<p class="section-title">考试锚点</p>' +
    '<div class="focus-tags">' + item.redPhrases.map(tag => '<span class="focus-tag">' + highlight(tag) + '</span>').join('') + '</div>' +
  '</section>';
}

function renderPairs(note){
  return '<section class="section">' +
    '<p class="section-title">双语原文</p>' +
    '<div class="pairs">' + (note.pairs || []).map(([en, zh]) =>
      '<div class="pair">' +
        '<p class="en">' + highlight(en) + '</p>' +
        '<p class="zh">' + highlight(zh) + '</p>' +
      '</div>'
    ).join('') + '</div>' +
  '</section>';
}

function renderLogic(note){
  return '<section class="section">' +
    '<p class="section-title">逻辑等式</p>' +
    '<p class="principle">' + highlight(note.point || '') + '</p>' +
    '<div class="equation"><code>' + highlight(note.equation || '') + '</code></div>' +
  '</section>';
}

function renderMemory(note){
  if (!note.memory || !note.memory.length) return '';
  return '<section class="section">' +
    '<p class="section-title">记忆线</p>' +
    '<ol class="memory">' + note.memory.map(line => '<li>' + highlight(line) + '</li>').join('') + '</ol>' +
  '</section>';
}

function renderImages(item){
  if (!item.images || !item.images.length) return '';
  return '<section class="section">' +
    '<p class="section-title">知识图</p>' +
    item.images.map(img =>
      '<figure class="figure">' +
        '<a href="' + escapeHtml(img.src) + '" target="_blank"><img src="' + escapeHtml(img.src) + '" alt="' + escapeHtml(img.caption) + '"></a>' +
        '<figcaption class="figcaption">' + escapeHtml(img.caption) + ' · PDF 第 ' + img.pdfPage + ' 页</figcaption>' +
      '</figure>'
    ).join('') +
  '</section>';
}

function renderCard(item){
  const note = getNote(item);
  const imageChip = item.images && item.images.length ? '<span class="chip green">知识图 ' + item.images.length + '</span>' : '';
  return '<article class="study-card" id="item-' + item.id + '">' +
    '<div class="study-head">' +
      '<div class="meta">' +
        '<span class="chip no">' + String(item.id).padStart(2, '0') + '</span>' +
        '<span class="chip">Ch.' + item.chapter + '</span>' +
        '<span class="chip">资料页 ' + item.summaryPage + '</span>' +
        (item.redCount ? '<span class="chip red">红字 ' + item.redCount + '</span>' : '') +
        imageChip +
      '</div>' +
      '<h2>' + highlight(item.title) + '</h2>' +
    '</div>' +
    '<div class="study-body">' +
      renderFocus(item) +
      renderLogic(note) +
      renderPairs(note) +
      renderMemory(note) +
      renderImages(item) +
    '</div>' +
  '</article>';
}

function setFilter(next){
  filter = next;
  showAll.classList.toggle('active', filter === 'all');
  showRed.classList.toggle('active', filter === 'red');
  showImage.classList.toggle('active', filter === 'image');
  render();
}

function render(){
  const items = filteredItems();
  renderMetrics(items);
  renderToc(items);
  cardsEl.innerHTML = items.map(renderCard).join('') || '<div class="empty">没有匹配的考点</div>';
}

searchEl.addEventListener('input', event => {
  query = event.target.value;
  render();
});
showAll.addEventListener('click', () => setFilter('all'));
showRed.addEventListener('click', () => setFilter('red'));
showImage.addEventListener('click', () => setFilter('image'));
render();
</script>
</body>
</html>
