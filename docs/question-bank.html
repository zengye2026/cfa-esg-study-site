<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>综合题库</title>
<style>
:root{
  --fluent-bg:#f5f5f5;--fluent-surface:#fff;--fluent-subtle:#fafafa;--fluent-line:#d1d1d1;--fluent-line2:#e0e0e0;
  --fluent-ink:#242424;--fluent-muted:#424242;--fluent-soft:#616161;--fluent-blue:#0f6cbd;--fluent-blue-hover:#115ea3;--fluent-blue-soft:#ebf3fc;
  --fluent-ok:#0e700e;--fluent-ok-bg:#f1faf1;--fluent-ok-line:#9fd89f;--fluent-bad:#bc2f32;--fluent-bad-bg:#fff4f4;--fluent-bad-line:#eeacb2;
  --fluent-warn:#8a5a00;--fluent-warn-bg:#fff8e1;--fluent-warn-line:#f5d56a;
  --source-textbook-bg:#ebf3fc;--source-textbook-line:#b4d6fa;--source-textbook-ink:#0f6cbd;
  --source-p300-bg:#e4f8f8;--source-p300-line:#9bd9db;--source-p300-ink:#006c70;
  --source-official-bg:#f7f0ff;--source-official-line:#d8b7ff;--source-official-ink:#6b3f99;
  --carbon-page:#f4f4f4;--carbon-surface:#fff;--carbon-line:#e0e0e0;--carbon-line2:#c6c6c6;--carbon-ink:#161616;--carbon-muted:#525252;
  --carbon-blue:#0f62fe;--carbon-blue-hover:#0043ce;--carbon-blue-soft:#edf5ff;--carbon-green:#24a148;--carbon-green-bg:#defbe6;--carbon-red:#da1e28;--carbon-red-bg:#fff1f1;--carbon-yellow-bg:#fcf4d6;
  --font:"Segoe UI",-apple-system,BlinkMacSystemFont,"Microsoft YaHei",Arial,sans-serif;--shadow2:0 1px 2px rgba(0,0,0,.08);--shadow4:0 2px 4px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--fluent-bg);color:var(--fluent-ink);font-family:var(--font);line-height:1.58}
button,input,select{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 88px}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}
h1{font-size:clamp(32px,5vw,52px);line-height:1.08;margin:0;letter-spacing:0;font-weight:650}
.home{display:inline-flex;align-items:center;justify-content:center;min-height:40px;text-decoration:none;border:1px solid var(--fluent-line);background:#fff;color:var(--fluent-blue);border-radius:6px;padding:9px 14px;font-weight:650;box-shadow:var(--shadow2)}
.mode-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.mode-tab{border:1px solid var(--fluent-line);background:#fff;color:var(--fluent-muted);border-radius:6px;min-height:40px;padding:9px 14px;font-weight:700;cursor:pointer}
.mode-tab.active{background:var(--fluent-blue);border-color:var(--fluent-blue);color:#fff}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.stat{min-width:78px;padding:11px 13px;border:1px solid var(--fluent-line2);border-radius:8px;background:#fff;box-shadow:var(--shadow2);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:transparent}.stat.total::before,.stat.done::before{background:var(--fluent-blue)}.stat.textbook::before{background:var(--source-textbook-ink)}.stat.p300::before{background:var(--source-p300-ink)}.stat.official::before{background:var(--source-official-ink)}.stat.wrong::before{background:var(--fluent-bad)}.stat.flagged::before{background:var(--fluent-warn)}
.stat strong{display:block;font-size:28px;line-height:1;font-weight:650}.stat small{display:block;margin-top:6px;color:var(--fluent-soft);font-size:13px;font-weight:650}.stat.wrong strong{color:var(--fluent-bad)}.stat.flagged strong{color:var(--fluent-warn)}
.toolbar{position:sticky;top:0;z-index:10;background:rgba(245,245,245,.9);backdrop-filter:blur(12px);padding:10px 0 12px;margin-bottom:12px}
.panel{background:#fff;border:1px solid var(--fluent-line2);border-radius:8px;box-shadow:var(--shadow4);padding:14px;display:grid;gap:10px}
.row,.meta,.actions,.hook-list,.review-cards{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn,.search,.select{min-height:40px;border:1px solid var(--fluent-line);background:#fff;border-radius:6px;padding:9px 13px;font-size:14px;font-weight:650;color:var(--fluent-muted);cursor:pointer}
.btn:hover{background:var(--fluent-subtle)}.btn.active,.btn.primary{background:var(--fluent-blue);border-color:var(--fluent-blue);color:#fff}.btn.warn{background:var(--fluent-bad-bg);border-color:var(--fluent-bad-line);color:var(--fluent-bad)}.btn.bookmark{background:var(--fluent-warn-bg);border-color:var(--fluent-warn-line);color:var(--fluent-warn)}.btn.ok{background:var(--fluent-ok-bg);border-color:var(--fluent-ok-line);color:var(--fluent-ok)}
.source-textbook{background:var(--source-textbook-bg);border-color:var(--source-textbook-line);color:var(--source-textbook-ink)}.source-p300{background:var(--source-p300-bg);border-color:var(--source-p300-line);color:var(--source-p300-ink)}.source-official{background:var(--source-official-bg);border-color:var(--source-official-line);color:var(--source-official-ink)}
.chapter-filter{background:var(--fluent-subtle)}.search{flex:1;min-width:min(360px,100%);font-weight:400;cursor:text}.countline,.copy-status{font-size:13px;color:var(--fluent-soft);font-weight:650}.copy-status{color:var(--fluent-ok)}
.grid{display:grid;gap:14px}.qcard{background:#fff;border:1px solid var(--fluent-line2);border-radius:8px;box-shadow:var(--shadow4);padding:18px;scroll-margin-top:128px;position:relative;overflow:hidden}.qcard.correct{border-color:var(--fluent-ok-line);background:linear-gradient(90deg,rgba(16,124,16,.08),#fff 18%);box-shadow:0 0 0 1px rgba(16,124,16,.12),var(--shadow4)}.qcard.correct::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--fluent-ok)}.qcard.wrong{border-color:var(--fluent-bad-line);background:linear-gradient(90deg,rgba(196,43,28,.08),#fff 18%);box-shadow:0 0 0 1px rgba(196,43,28,.12),var(--shadow4)}.qcard.wrong::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--fluent-bad)}.qcard.flagged{box-shadow:0 0 0 1px rgba(138,90,0,.18),var(--shadow4)}
.chip{display:inline-flex;align-items:center;min-height:26px;border:1px solid var(--fluent-line);background:#fff;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:650;color:var(--fluent-muted)}.chapter-chip{background:var(--fluent-subtle)}.knowledge-chip{background:var(--fluent-warn-bg);border-color:var(--fluent-warn-line);color:var(--fluent-warn)}.wrong-chip{background:var(--fluent-bad-bg);border-color:var(--fluent-bad-line);color:var(--fluent-bad)}
.stem{font-size:18px;font-weight:650;line-height:1.5;margin:14px 0 12px;color:var(--fluent-ink);white-space:pre-wrap}.stem-zh{margin:-2px 0 12px;color:var(--fluent-muted);background:var(--fluent-blue-soft);border-left:3px solid var(--fluent-blue);padding:10px 12px;border-radius:0 8px 8px 0;font-weight:500}
.options{display:grid;gap:9px;margin:12px 0}.opt{width:100%;text-align:left;border:1px solid var(--fluent-line);background:#fff;border-radius:8px;padding:11px 12px;font-size:15.5px;line-height:1.55;cursor:pointer;display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:start}.opt b{color:var(--fluent-blue);font-weight:650}.opt:hover{border-color:var(--fluent-blue);background:#f8fbff}.opt.selected{border-color:var(--fluent-blue);background:var(--fluent-blue-soft)}.opt.answer{border-color:var(--fluent-ok-line);background:var(--fluent-ok-bg);box-shadow:inset 4px 0 0 var(--fluent-ok)}.opt.bad{border-color:var(--fluent-bad-line);background:var(--fluent-bad-bg);box-shadow:inset 4px 0 0 var(--fluent-bad)}
.opt-text{display:grid;gap:4px}.opt-zh{color:var(--fluent-soft);font-size:14px;border-top:1px dashed var(--fluent-line);padding-top:4px;margin-top:2px}
.answerbox{border:1px solid var(--fluent-line2);border-radius:8px;background:#fff;margin-top:14px;overflow:hidden}.answer-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 13px;border-bottom:1px solid var(--fluent-line2);font-weight:650;background:var(--fluent-subtle)}.answer-head.answer-correct{background:var(--fluent-ok-bg);border-bottom-color:var(--fluent-ok-line)}.answer-head.answer-wrong{background:var(--fluent-bad-bg);border-bottom-color:var(--fluent-bad-line)}
.result-correct{border-color:var(--fluent-ok-line);background:#fff;color:var(--fluent-ok)}.result-wrong{border-color:var(--fluent-bad-line);background:#fff;color:var(--fluent-bad)}.result-correct::before{content:"✓";font-weight:700;margin-right:5px}.result-wrong::before{content:"×";font-weight:700;margin-right:5px}
.answer-body{display:grid;gap:12px;padding:14px;background:#fff}.block{border-top:1px solid var(--fluent-line2);padding-top:12px}.block:first-child{border-top:0;padding-top:0}.block h3{font-size:13px;margin:0 0 6px;color:var(--fluent-soft);letter-spacing:0;font-weight:650}.block-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}.block-title h3{margin:0}.block p{margin:0;white-space:pre-wrap}.pair{display:grid;gap:8px}.pair .en{color:var(--fluent-ink);font-weight:500}.pair .zh{color:var(--fluent-muted);border-top:1px dashed var(--fluent-line);padding-top:8px}
.explain-tag{display:inline-flex;align-items:center;border:1px solid var(--fluent-warn-line);background:var(--fluent-warn-bg);color:var(--fluent-warn);border-radius:999px;padding:2px 8px;font-size:12px;font-weight:650;line-height:1.3}.hook{display:inline-flex;border:1px solid #b4d6fa;background:var(--fluent-blue-soft);color:var(--fluent-blue);border-radius:999px;padding:3px 8px;font-size:12px;font-weight:650;line-height:1.25}.logic{display:inline-block;border:1px solid #b4d6fa;background:var(--fluent-blue-soft);color:var(--fluent-blue);border-radius:6px;padding:7px 10px;font-weight:650}.ref-table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 8px;background:#fff}.ref-table th,.ref-table td{border:1px solid var(--fluent-line2);padding:7px 8px;text-align:left;vertical-align:top}.ref-table th{background:var(--fluent-subtle)}
.empty{background:#fff;border:1px dashed var(--fluent-line);border-radius:8px;padding:22px;text-align:center;color:var(--fluent-soft);font-weight:650}.loadrow{display:flex;justify-content:center;margin-top:14px}.footerbar{position:fixed;right:16px;bottom:16px;display:flex;gap:8px}.float{border:1px solid var(--fluent-line);background:#fff;border-radius:999px;padding:10px 13px;box-shadow:var(--shadow4);font-weight:700;color:var(--fluent-muted);cursor:pointer;text-decoration:none}
.hide{display:none!important}
/* Carbon mock mode */
.mock-view{color:var(--carbon-ink)}.mock-view .panel,.mock-card{background:var(--carbon-surface);border:1px solid var(--carbon-line);border-radius:4px;box-shadow:none}.mock-view .panel{padding:14px}.mock-card{padding:18px}.mock-view .btn,.mock-view .select{border-radius:2px;border-color:var(--carbon-line);color:var(--carbon-ink);background:#fff}.mock-view .btn.active,.mock-view .btn.primary{background:var(--carbon-blue);border-color:var(--carbon-blue);color:#fff}.mock-view .btn.warn{background:#fff;border-color:#ffd7d9;color:var(--carbon-red)}.mock-view .search{border-radius:2px}.mock-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.timer{font-size:24px;font-weight:700;color:var(--carbon-ink)}.mock-nav{display:flex;gap:6px;flex-wrap:wrap}.navbtn{width:34px;height:34px;border:1px solid var(--carbon-line);background:#fff;border-radius:2px;font-weight:650;color:var(--carbon-muted);cursor:pointer}.navbtn.current{background:var(--carbon-blue);border-color:var(--carbon-blue);color:#fff}.navbtn.answered{border-color:#78a9ff;background:var(--carbon-blue-soft);color:var(--carbon-blue-hover)}.navbtn.uncertain{border-color:var(--yellow,#f1c21b);background:var(--carbon-yellow-bg);color:#5d4700}.mock-question{display:grid;gap:12px}.mock-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px}.score{font-size:42px;font-weight:700;line-height:1}.review-card{border:1px solid var(--carbon-line);background:#fff;border-radius:4px;padding:10px 12px;font-weight:650;cursor:pointer}.review-card.active{border-color:var(--carbon-blue);box-shadow:inset 0 -3px 0 var(--carbon-blue)}.table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}.table th,.table td{border:1px solid var(--carbon-line);padding:8px;text-align:left}.table th{background:#f4f4f4}.history-list{display:grid;gap:8px}.history-item{border:1px solid var(--carbon-line);border-radius:4px;background:#fff;padding:10px 12px}
@media(max-width:720px){.wrap{padding:16px 10px 78px}.qcard,.mock-card{padding:14px}.stem{font-size:16.5px}.opt{font-size:14px;grid-template-columns:28px 1fr}.footerbar{right:10px;bottom:10px}.toolbar{position:static}.topline{display:block}.home{margin-top:12px}.score{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topline">
      <div>
        <h1>综合题库</h1>
        <div class="mode-tabs">
          <button class="mode-tab active" id="practiceTab">练习模式</button>
          <button class="mode-tab" id="mockTab">模考模式</button>
        </div>
      </div>
      <a class="home" href="index.html">返回主页</a>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <section id="practiceView">
    <section class="toolbar">
      <div class="panel">
        <div class="row" id="chapterTabs"></div>
        <div class="row" id="sourceTabs"></div>
        <div class="row">
          <input class="search" id="search" placeholder="搜索题干、知识点、解析、P300页码">
          <button class="btn active" data-filter="all">全部</button>
          <button class="btn" data-filter="todo">未做</button>
          <button class="btn warn" data-filter="wrong">错题</button>
          <button class="btn bookmark" data-filter="flagged">收藏</button>
          <button class="btn primary" id="shuffle">随机顺序</button>
          <button class="btn" id="copyWrong">复制错题</button>
          <button class="btn warn" id="reset">清空作答</button>
        </div>
        <div class="row"><span class="countline" id="countLine"></span><span class="copy-status" id="copyStatus"></span></div>
      </div>
    </section>
    <main class="grid" id="questionGrid"></main>
    <div class="loadrow"><button class="btn primary" id="loadMore">加载更多</button></div>
  </section>

  <section id="mockView" class="mock-view hide">
    <section class="toolbar">
      <div class="panel">
        <div class="row">
          <select class="select" id="mockType">
            <option value="official1">官方 Mock 1</option>
            <option value="official2">官方 Mock 2</option>
            <option value="p300">P300 模考</option>
            <option value="textbook">教材模考</option>
            <option value="mixed">混合模考</option>
          </select>
          <button class="btn primary" id="startMock">开始模考</button>
          <button class="btn warn" id="submitMock">提交模考</button>
          <span class="timer" id="mockTimer">140:00</span>
          <span class="countline" id="mockProgress">未开始</span>
        </div>
        <div class="mock-nav" id="mockNav"></div>
      </div>
    </section>
    <main class="grid">
      <section class="mock-card" id="mockQuestion"></section>
      <section class="mock-card hide" id="mockResult"></section>
      <section class="mock-card" id="mockHistory"></section>
    </main>
  </section>
</div>
<div class="footerbar">
  <button class="float" id="toTop">回到顶部</button>
  <a class="float" href="index.html">返回主页</a>
</div>
<script src="question-bank-data.js?v=20260517b"></script>
<script src="question-bank-runtime.js?v=20260517b"></script>
</body>
</html>
